<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>书签桥</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <img class="logo" src="icon-48.png" alt="书签桥" />
        <div>
          <h1>书签桥</h1>
          <p>跨浏览器配置文件快速同步书签</p>
        </div>
      </header>

      <section class="notice">
        <span id="browser-name">当前浏览器</span>配置文件生成同步码，目标配置文件接收并合并。
      </section>

      <section class="card send-card">
        <div class="section-heading"><span class="step">1</span><div><h2>发送书签</h2><p>生成一次性可复制的加密同步码</p></div></div>
        <div class="field-meta"><label for="source-filter">发送哪个位置</label><span id="source-count" class="field-count"></span></div>
        <input id="source-filter" class="filter-input" type="search" autocomplete="off" placeholder="搜索子文件夹名称或路径（可选）" />
        <div class="select-wrap"><select id="source-root"></select></div>
        <button id="toggle-source-tree" class="link-button" type="button">浏览全部子文件夹</button>
        <p class="field-hint">默认显示顶层和一级子文件夹；不确定关键词时可浏览全部位置。</p>
        <label for="send-password">设置同步密码（可选）</label>
        <input id="send-password" class="password" type="password" autocomplete="new-password" placeholder="留空则不加密；填写后接收端需输入同一密码" />
        <label for="send-password-confirm">确认同步密码</label>
        <input id="send-password-confirm" class="password" type="password" autocomplete="new-password" placeholder="再次输入（留空时也留空）" />
        <button id="create-token" class="primary">生成同步码</button>
        <div id="send-result" class="result hidden"></div>
        <textarea id="token-output" class="token" readonly placeholder="同步码会显示在这里"></textarea>
        <div class="button-row">
          <button id="copy-token" disabled>复制同步码</button>
          <button id="download-token" disabled>保存为文件</button>
        </div>
        <p class="hint">同步码较长时，优先保存为文件并在目标环境导入，成功率更高。</p>
      </section>

      <section class="card receive-card">
        <div class="section-heading"><span class="step">2</span><div><h2>接收并合并</h2><p>粘贴同步码，先预览再写入</p></div></div>
        <label for="token-input">同步码</label>
        <textarea id="token-input" class="token input" placeholder="粘贴 BM2. 开头的同步码，或导入同步文件"></textarea>
        <div id="drop-zone" class="drop-zone" tabindex="0">
          <div class="drop-title">拖拽同步文件到这里</div>
          <div class="drop-subtitle">大同步码推荐拖拽导入，不会打开系统文件窗口</div>
          <div class="file-row">
            <button id="open-file-import" class="file-button" type="button">在侧边栏选择文件</button>
            <span id="file-name">未选择文件</span>
          </div>
        </div>
        <p class="file-hint">文件会在本浏览器窗口的插件侧边栏选择，不打开独立标签页。</p>
        <div class="receive-password-block">
          <label for="receive-password">同步密码（如发送端设置过）</label>
          <input id="receive-password" class="password" type="password" autocomplete="current-password" placeholder="未加密同步码可留空" />
          <button id="inspect-token">解密并预览差异</button>
        </div>
        <div id="preview" class="preview hidden"></div>
        <div id="merge-options" class="hidden">
          <label for="destination-root">合并到</label>
          <div class="select-wrap"><select id="destination-root"></select></div>
          <fieldset>
            <legend>处理重复项</legend>
            <label class="radio"><input type="radio" name="merge-mode" value="smart" checked />智能合并：同文件夹内相同网址跳过</label>
            <label class="radio"><input type="radio" name="merge-mode" value="append" />全部添加：保留原有结构</label>
          </fieldset>
          <button id="merge-token" class="primary">确认合并</button>
        </div>
        <div id="receive-result" class="result hidden"></div>
      </section>

      <div id="progress-wrap" class="progress-wrap hidden">
        <div class="progress-line"><span id="progress-label"></span><button id="cancel-operation" class="cancel hidden">取消</button></div>
        <progress id="progress-bar" max="100" value="0"></progress>
      </div>

      <div id="merge-history" class="merge-history hidden"></div>

      <footer>v0.4.6 · 加密同步码只保存在你复制或保存的位置，不上传服务器</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
